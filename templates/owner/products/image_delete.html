{% extends "base.html" %}

{% block title %}
    Delete Gallery Image | Naturale May
{% endblock %}

{% block content %}

<section class="owner-dashboard">

    <div class="container">

        <div class="dashboard-section">

            <span class="section-label">
                Product Gallery
            </span>

            <h1>
                Delete Gallery Image
            </h1>

            <p>
                Are you sure you want to delete this image from
                <strong>{{ product.name }}</strong>?
            </p>


            {% if image.image %}

                <div class="form-group">

                    <img
                        src="{{ image.image.url }}"
                        alt="{{ image.alt_text|default:product.name }}"
                        style="max-width: 350px; display: block;"
                    >

                </div>

            {% endif %}


            <div class="form-actions">

                <a
                    href="{% url 'owner:product_gallery' product.pk %}"
                    class="dashboard-action"
                >
                    Cancel
                </a>


                <form method="post">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="dashboard-action cancel"
                    >
                        Yes, Delete Image
                    </button>

                </form>

            </div>

        </div>

    </div>

</section>

{% endblock %}
