{% extends "base.html" %}

{% block title %}
    Message Sent | Natural May
{% endblock %}

{% block content %}

<section class="booking-success">

    <div class="container">

        <div class="success-card">

            <div class="success-icon">
                ✓
            </div>

            <span class="section-label">
                Message Received
            </span>

            <h1>
                Thank You!
            </h1>

            <p>
                Your message has been successfully sent to Natural May.
                We will get back to you as soon as possible.
            </p>

            <div class="success-actions">

                <a
                    href="{% url 'core:home' %}"
                    class="btn btn-primary"
                >
                    Return Home
                </a>

                <a
                    href="{% url 'contact:contact' %}"
                    class="btn btn-secondary"
                >
                    Back to Contact
                </a>

            </div>

        </div>

    </div>

</section>

{% endblock %}
